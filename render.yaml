services:
  - type: web
    name: course-client-070
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 600 --graceful-timeout 600 --access-logfile - --error-logfile - --log-level info
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: PYTHON_VERSION
        value: 3.11.9
